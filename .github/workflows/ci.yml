# Runs on every push to main or dev and every pull request. Railway waits for
# these checks before deploying either environment (checkSuites in
# .railway/railway.ts), so a commit that fails here never goes live, on dev
# or in production.
#
# `npm run check` runs the same steps locally (minus the database ones).

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway Postgres, so migrations and database tests run for real.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evercent_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/evercent_ci
      DATABASE_SSL: disable
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Migrations apply to an empty database
        run: npm run migrate
      - name: lib/db/schema.ts matches the migrations
        run: npx kysely-codegen --verify
      - name: Unit, component and database tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build

  # Browser tests need Clerk's DEVELOPMENT keys and a test user, stored as
  # repository secrets. Off until the repository variable E2E_ENABLED is
  # "true" (see README "Testing").
  e2e:
    name: End-to-end (Playwright)
    needs: check
    if: vars.E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evercent_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/evercent_ci
      DATABASE_SSL: disable
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
